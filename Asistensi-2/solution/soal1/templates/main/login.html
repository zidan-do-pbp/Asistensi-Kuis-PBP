{# DOKUMENTASI (template kuis, jangan diubah): dirender login_user() dengan konteks form (AuthenticationForm). Form POST wajib punya csrf_token. form.as_p menampilkan field dan error. Setelah login sukses view redirect ke main:home #}
<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8"><title>Login</title></head>
<body>
    <h1>Login</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>
</body>
</html>
