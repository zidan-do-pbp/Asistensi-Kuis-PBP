<h1>Daftar Project</h1>

<ul>
    {% for p in projects %}
    <li>{{p.name}} - {{p.description}} <a href="{% url 'main:edit_project' p.id %}">Edit</a>
        <form method="post" action="{% url 'main:delete_project' p.id %}" style="display:inline">
            {% csrf_token %}
            <button type="submit">Hapus</button>
        </form>
    </li>
    {% empty %}
    <li>Belum ada project.</li>
    {% endfor %}
</ul>
